name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # pyrightconfig in pyproject points at ./.venv, so install into one.
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev,ui]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pyright
      - run: .venv/bin/pytest
